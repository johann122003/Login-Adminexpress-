<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"> 
    <link rel="stylesheet" href="css/estilos.css">
    <title>Login AdminExpress</title>
</head>
<body>

     <main class="contenedor-principal">
        <section class="panel-azul">
            <h1>AdminExpress</h1>
        </section>

        <section class="panel-blanco">
            <div class="contenido-formulario">
                <h2>Let's <strong>Sign In</strong> 👇</h2>
                <p class="subtitulo">Hey, Enter your details to get sign in<br> to your account. </p>

                <form action="#">
                    <div class="grupo-input">
                        <label for = "email" class="etiqueta">Email</label>
                        <div class="input-contenedor">
                            <span class="icono">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="5" width="18" height="14" rx="2"/>
                                    <polyline points="3 7 12 13 21 7"/>
                                </svg>
                            </span>
                            <input type="email" id ="email" placeholder="Enter Email">
                        </div>
                    </div>

                     <div class="grupo-input">
                        <label for = "password" class="etiqueta">Password</label>
                        <div class="input-contenedor">
                            <span class="icono">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="5" y="11" width="14" height="10" rx="2"/>
                                    <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                                </svg>
                            </span>
                            <input type="password" id="password" placeholder="Enter Password">
                            <span class="icono icono-ojo">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                    <line x1="1" y1="1" x2="23" y2="23"/>
                                </svg>
                            </span>
                        </div>
                    </div>

                    <a href="#" class="link-olvido">Forgot password?</a>
                    <button type="submit" class="btn-signin">Sign in</button>

                </form>

                <p class="texto-registro">Don't have an account? 
                    <a href="#">Sign Up</a>
                </p>
        
            </div>

        
        </section>


     </main>

</body>
</html>
